[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pwcheck"
dynamic = ["version"]
description = "Password strength checker with a privacy-preserving breach lookup (Have I Been Pwned, k-anonymity)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "N30n" }]
keywords = ["security", "cybersecurity", "password", "hibp", "k-anonymity", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pwcheck = "pwcheck.cli:main"

[project.urls]
Homepage = "https://github.com/cat-mycode/pwcheck"
Issues = "https://github.com/cat-mycode/pwcheck/issues"

[tool.setuptools.dynamic]
version = { attr = "pwcheck.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
